name: foam-frenzy
title: Foam Frenzy
adopt-info: foam-frenzy
base: core24
summary: Foam dart blaster battles for up to eight friends, on one screen or many.
description: |
  Foam Frenzy is a fast, silly foam dart party game for 2 to 8 campers. Dash
  around the gym or the test lab, scoop up darts, dive out of the way and tag
  your friends before the clock runs out. Every dart you fire lands on the
  floor, so ammo is precious and anyone can grab it.

  - Four modes: Free-for-all, Team Battle, Capture the Flag and Dart Hoarder
  - Play on one screen with a controller each, on your local network, or
    online through a LinuxGroove game server
  - Fill empty spots with bots, or warm up in a guided practice round
  - Made for controllers and handhelds, fully playable with a keyboard
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND Apache-2.0
website: https://github.com/LinuxGroove/foam-frenzy
source-code: https://github.com/LinuxGroove/foam-frenzy
issues: https://github.com/LinuxGroove/foam-frenzy/issues

platforms:
  amd64:
  arm64:

apps:
  foam-frenzy:
    command: bin/foam-frenzy
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network
      - network-bind

parts:
  foam-frenzy:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/foam-frenzy"
      test -f "$CRAFT_PART_INSTALL/game/foam-frenzy.pck"
      install -m 755 snap/local/foam-frenzy "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
